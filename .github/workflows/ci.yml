name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─── Quality Gate: Lint + Type Check + Tests ────────────────────────────────
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install quality-gate tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff (strict — fail on any error)
        run: ruff check .

      - name: Type-check with MyPy (advisory — non-blocking)
        run: mypy build_matrix/schemas.py build_matrix/models.py api.py db.py
        continue-on-error: true

      - name: Compile-check all Python files (syntax validation)
        run: python -m compileall -q .

      - name: Run test suite with coverage
        env:
          GEMINI_API_KEY: "dummy_key_for_tests"
          DATABASE_URL: "sqlite:///test.db"
          ENVIRONMENT: "test"
        run: |
          pytest tests/ -v --tb=short \
            --cov=build_matrix --cov=api --cov=db \
            --cov-report=term-missing \
            --cov-fail-under=40

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  # ─── Docker Build Smoke Test ─────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t buildmetrics:ci-${{ github.sha }} --target runner .

      - name: Smoke test — healthz endpoint
        run: |
          docker run -d --name test-api \
            -e GEMINI_API_KEY=dummy \
            -e DATABASE_URL=sqlite:///test.db \
            -e ENVIRONMENT=test \
            -p 8000:8000 \
            buildmetrics:ci-${{ github.sha }} \
            uvicorn api:app --host 0.0.0.0 --port 8000
          sleep 5
          curl -f http://localhost:8000/healthz || (docker logs test-api && exit 1)
          docker stop test-api
