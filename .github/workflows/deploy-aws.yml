name: AWS Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'AWS Deployment Target'
        required: true
        default: 'ec2'
        type: choice
        options:
          - ec2
          - ecr

jobs:
  build-and-test:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run Test Suite
        run: |
          python train_model.py
          python -m pytest tests/test_civil_math.py tests/test_cost_engine.py tests/test_db.py tests/test_dxf_geotech_vastu.py tests/test_engineering.py tests/test_ifc.py tests/test_layout.py tests/test_pinn_marl_eeg_evac.py -v

  deploy-ec2:
    name: Deploy to AWS EC2
    needs: build-and-test
    if: ${{ github.event.inputs.deployment_target == 'ec2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Remote EC2 via SSH
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.AWS_EC2_HOST }}
          SSH_USER: ${{ secrets.AWS_EC2_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
        run: |
          echo "Connecting to AWS EC2: $SSH_HOST"
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "cd /home/ubuntu/BuildMetrics-AI && git pull origin main && docker compose up -d --build"
