services:
  # ─── FastAPI Backend (Free Tier) ───────────────────────────────────────────
  - type: web
    name: buildmetrics-api
    env: docker
    region: oregon
    plan: free
    dockerCommand: "uvicorn api:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        # Using SQLite for completely free tier without 90-day expiry of Postgres
        value: sqlite:///buildmetrics.db
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        # Replace with your Streamlit Community Cloud URL later
        value: "*"
      # REDIS_URL left empty so exports run synchronously (Celery worker isn't feasible on 100% free tier)
